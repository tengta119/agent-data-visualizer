server:
  port: 8091

command:
  execution:
    policy:
      max-command-length: 1000
      max-output-chars: 1048576
      # 开发环境：禁止独立 rm 命令或词，其余有效命令必须由用户允许一次。
      # "*" 是全量审批模式，管道、重定向及多行命令也送审批；不直接执行任何命令。
      local-allow: []
      remote-allow: []
      local-prompt: ["*"]
      remote-prompt: ["*"]
      # 可选择任意已连接远程终端，执行前仍须本次审批；空 host 仍无效。
      remote-allowed-hosts: ["*"]
      # 审批等待超时（毫秒）；默认 60000，上限默认 300000，防止无限等待消耗执行线程。
      # approval-timeout-millis: 60000
      # approval-timeout-millis-max: 300000
      # 命令审批并发上限：同时处于 PENDING（等待用户决定）的审批数量，分整个 JVM 与单个 requestId 两级。
      # 超限的命令直接返回 forbidden，不占用 Agent 执行线程等待。
      max-pending-approvals: 5
      max-pending-approvals-per-request: 1
      # 本地命令执行超时（毫秒）：超时后强制销毁并重启本地 Shell，命令返回 timeout；
      # 避免一条挂死命令永久占用本地 Shell。默认 30000，上限默认 300000。
      local-execution-timeout-millis: 30000
      local-execution-timeout-millis-max: 300000
      # 本地 Shell 交互专用单线程执行器的有界队列容量；队列满时返回 unavailable。
      local-execution-queue-capacity: 64
      # 存活本地 Shell 进程数量上限（每个 Shell 对应一次请求/一条无上下文命令）。
      # 达到上限时按 LRU 淘汰最久未使用的空闲 Shell；无法淘汰时命令返回 unavailable。
      max-concurrent-shells: 8
      # 本地 Shell 空闲回收阈值（毫秒，默认 20 分钟，与流式 emitter 超时对齐）。
      # 只回收“超过阈值、当前空闲且其请求已不再活跃”的 Shell；回收会丢失该 Shell 的 cd/环境变量。
      shell-idle-timeout-millis: 1200000


# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

gateway:
  socket:
    port: 9077

